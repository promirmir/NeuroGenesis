name: Windows standalone EXE

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - 'neurogenesis/**'
      - 'desktop_launcher.py'
      - 'tests/**'
      - '.github/workflows/windows-exe.yml'
      - '.github/workflows/foundation-cpu.yml'

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject private names and sensitive source data
        run: python -m scripts.privacy_audit --git
      - name: Run regression tests on Windows
        run: python -m unittest discover -s tests -v
      - name: Verify real SQLite memory and brain without opening UI
        run: python desktop_launcher.py --self-test
      - name: Install Windows packaging tool
        run: python -m pip install "pyinstaller>=6,<7"
      - name: Build standalone desktop binary
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name NeuroGenesis desktop_launcher.py
      - name: Smoke-test EXE with real SQLite
        shell: pwsh
        run: |
          $exe = (Resolve-Path '.\dist\NeuroGenesis.exe').Path
          $proc = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            throw "Standalone EXE self-test failed (exit=$($proc.ExitCode))"
          }
      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\NeuroGenesis.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  NeuroGenesis.exe" | Set-Content -Encoding ascii .\dist\NeuroGenesis.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: NeuroGenesis-Windows-x64
          path: |
            dist/NeuroGenesis.exe
            dist/NeuroGenesis.exe.sha256
          if-no-files-found: error
          retention-days: 14
