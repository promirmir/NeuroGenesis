[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "neurogenesis-research"
version = "0.13.2"
description = "Experimental spiking network with bounded structural neuroplasticity and auditable self-state"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "NeuroGenesis contributors" }]
keywords = ["neuroscience", "spiking-neural-network", "plasticity", "research"]
classifiers = ["Programming Language :: Python :: 3", "Development Status :: 2 - Pre-Alpha"]
dependencies = []

[project.optional-dependencies]
foundation = ["torch>=2.5,<3"]
command-center = ["PySide6-Essentials>=6.8,<7"]
dialogue = ["torch>=2.5,<3", "transformers>=4.51,<6", "peft>=0.15,<1", "accelerate>=1,<2", "huggingface-hub>=0.30,<2", "datasets>=3,<7", "safetensors>=0.4,<1"]

[project.scripts]
neurogenesis = "neurogenesis.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["neurogenesis*"]
